<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Analytics Dashboard</title>
    <link rel="preload" href="{{ url_for('static', filename='fonts/Oswald/Oswald-VariableFont_wght.ttf') }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1rem 56px 1rem;
        }

        .login-card {
            background: rgba(255, 255, 255, .94);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .5);
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(8, 60, 80, .35);
            width: 100%;
            max-width: 380px;
            padding: 1.75rem 1.5rem;
        }

        .login-logo {
            width: 60px;
            height: 60px;
            padding: 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 100%);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 6px 18px rgba(13, 148, 136, .45), inset 0 1px 0 rgba(255, 255, 255, .3);
        }
        .login-logo svg {
            width: 100%;
            height: 100%;
        }

        /* Footer note under the form: a hairline divider + a small lock icon,
           set apart from the Sign In button so it reads as a reassurance line
           rather than crowding the CTA. */
        .login-note {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(15, 118, 110, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            color: #64748b;
            font-size: .72rem;
            letter-spacing: .01em;
        }
        .login-note svg { width: 13px; height: 13px; flex-shrink: 0; opacity: .8; }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
        }

        .h40 { height: 40px; }
    </style>
</head>

<body>
    <div class="login-card">
        <!-- Logo/Icon -->
        <div class="text-center mb-6">
            <div class="login-logo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                    </path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-900 mb-1">Welcome Back</h1>
            <p class="text-sm text-gray-500">Sign in to the Course Analytics Dashboard</p>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="error-message p-3 mb-4">
            <p class="text-red-700 text-sm font-medium">{{ error }}</p>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-4">
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="input-field w-full px-3 rounded-lg h40" placeholder="Enter your username" autofocus>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="input-field w-full px-3 rounded-lg h40" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary w-full px-4 text-white font-semibold rounded-lg h40">
                Sign In
            </button>
        </form>

        <!-- Reassurance note -->
        <div class="login-note">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
            </svg>
            <span>Secure access to Course Analytics Dashboard</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Safety &amp; Excellence Dashboard (v1.3) © 2025 Nelco</p>
    </footer>
</body>

</html>
